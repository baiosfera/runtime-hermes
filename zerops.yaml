zerops:
  - setup: hermes
    build:
      base: ubuntu/python@3.12
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y --no-install-recommends git curl ca-certificates tar gzip build-essential
      buildCommands:
        - mkdir -p ./bin
        - curl -fsSL https://github.com/Gentleman-Programming/gentle-ai/releases/download/v4.4.0/gentle-ai_4.4.0_linux_amd64.tar.gz -o /tmp/gentle-ai.tar.gz && tar -xzf /tmp/gentle-ai.tar.gz -C ./bin && chmod +x ./bin/gentle-ai && rm -f /tmp/gentle-ai.tar.gz
        - curl -fsSL https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64 -o ./bin/ttyd && chmod +x ./bin/ttyd
        - curl -fsSL https://github.com/zeropsio/zcli/releases/latest/download/zcli-linux-amd64 -o ./bin/zcli && chmod +x ./bin/zcli || true
        - pip install --no-cache-dir --upgrade pip setuptools wheel && pip install --no-cache-dir --target=./vendor -r requirements.txt
        - find ./vendor -type d -name "__pycache__" -exec rm -rf {} + 2>/dev/null || true
      deployFiles:
        - .
      cache:
        - vendor
    run:
      base: ubuntu/python@3.12
      prepareCommands:
        - sudo apt-get update && sudo apt-get install -y --no-install-recommends tmux
      volume:
        hostname: localstorage
        mountPath: /mnt/localstorage
        readOnly: false
      ports:
        - port: 8000
          httpSupport: true
      initCommands:
        - sudo mkdir -p /mnt/localstorage/hermes/.hermes /mnt/localstorage/engram /mnt/localstorage/bin /mnt/localstorage/skills && sudo chown -R zerops:zerops /mnt/localstorage/hermes /mnt/localstorage/engram /mnt/localstorage/bin /mnt/localstorage/skills
        - test -f /mnt/localstorage/hermes/.hermes/SOUL.md || cp /var/www/SOUL.md /mnt/localstorage/hermes/.hermes/SOUL.md
        - test -f /mnt/localstorage/hermes/.hermes/config.yaml || cp /var/www/config.yaml /mnt/localstorage/hermes/.hermes/config.yaml
        - ln -sfn /mnt/localstorage/hermes/.hermes ~/.hermes
        - for f in /var/www/bin/* /mnt/localstorage/bin/*; do [ -f "$f" ] && [ -x "$f" ] && sudo ln -sfn "$f" "/usr/local/bin/$(basename "$f")"; done
        - 'command -v npm >/dev/null 2>&1 && HOME=/home/zerops gentle-ai install --agents hermes --scope global || true'
      envVariables:
        PORT: "8000"
        PYTHONPATH: "/var/www/vendor:/var/www"
        HERMES_MODEL_ENDPOINT: "http://bifrost:8080/v1"
        HERMES_MODEL_NAME: "auto"
        BIFROST_VIRTUAL_KEY: "vk-hermes-agent"
        DATABASE_URL: ${database_connectionString}
        SUPERUSER_URL: "postgresql://${database_superUser}:${database_superUserPassword}@${database_hostname}:${database_port}/${database_dbName}"
        NATS_URL: ${nats_connectionString}
        ZCP_NATS_URL: ${nats_connectionString}
        VALKEY_URL: ${valkey_connectionString}
        LOCAL_STORAGE_PATH: "/mnt/localstorage/hermes"
        ENGRAM_STORAGE_DIR: "/mnt/localstorage/engram"
        API_SERVER_ENABLED: "true"
        CREWAI_TELEMETRY_OPT_OUT: "true"
        OTEL_SDK_DISABLED: "true"
        # TTYD_USER / TTYD_PASSWORD are inherited directly from Project Shared Vault
      start: python3 /var/www/main.py
      healthCheck:
        httpGet:
          port: 8000
          path: /healthz
