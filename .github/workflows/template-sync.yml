name: Sync from Upstream Template

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: AndreasAugustin/actions-template-sync@v2
        with:
          source_repo_path: baiosfera/runtime-hermes
          upstream_branch: main
          pr_title: "chore(template): sync upstream runtime-hermes improvements"
          pr_commit_msg: "chore(template): sync upstream runtime-hermes"
